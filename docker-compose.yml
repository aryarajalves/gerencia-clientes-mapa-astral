version: "3.7"

services:
  # --------------------------------------------------------------------------------
  # BACKEND SERVICE
  # --------------------------------------------------------------------------------
  backend:
    image: aryarajalves/gestao-clientes-mapa-astral:backend-1.0.2
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - network_swarm_public
    environment:
      # Variáveis de Ambiente (Mapeadas do arquivo .env ou definidas aqui)
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:5174,https://gestaomapa.jords.site

      # --- BASEROW ---
      - BASEROW_API_URL=${BASEROW_API_URL}
      - BASEROW_API_TOKEN=${BASEROW_API_TOKEN}
      - BASEROW_TABLE_ID=${BASEROW_TABLE_ID}
      - BASEROW_TABLE_ID_INFO=${BASEROW_TABLE_ID_INFO}

      # --- CHATWOOT ---
      - CHATWOOT_API_URL=${CHATWOOT_API_URL}
      - CHATWOOT_API_TOKEN=${CHATWOOT_API_TOKEN}
      - CHATWOOT_ACCOUNT_ID=${CHATWOOT_ACCOUNT_ID}

      # --- N8N / AUTOMAÇÃO ---
      - N8N_WEBHOOK_GERAR_MAPA_URL=${N8N_WEBHOOK_GERAR_MAPA_URL}

      # --- WHATSAPP OFFICIAL API (META) ---
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}

      # --- REDIS (CACHE) ---
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      # - REDIS_PASSWORD=suasenha (se houver)

      # --- SENTRY (MONITORAMENTO) ---
      - SENTRY_DSN=${SENTRY_DSN}

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      labels:
        - "traefik.enable=true"
        # Roteamento Backend (API)
        - "traefik.http.routers.backend.rule=Host(`api.exemplo.com`)"
        - "traefik.http.routers.backend.entrypoints=websecure"
        - "traefik.http.routers.backend.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.backend.loadbalancer.server.port=8000"
        - "traefik.http.middlewares.backend-cors.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE"
        - "traefik.http.middlewares.backend-cors.headers.accesscontrolalloworiginlist=https://gestaomapa.jords.site"
        - "traefik.http.middlewares.backend-cors.headers.accesscontrolmaxage=100"
        - "traefik.http.middlewares.backend-cors.headers.addvaryheader=true"
        - "traefik.http.routers.backend.middlewares=backend-cors"

  # --------------------------------------------------------------------------------
  # FRONTEND SERVICE
  # --------------------------------------------------------------------------------
  frontend:
    image: aryarajalves/gestao-clientes-mapa-astral:frontend-1.0.2
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL da API para o Frontend saber onde bater (Build Time)
        - VITE_API_URL=https://api.exemplo.com
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
    networks:
      - network_swarm_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        # Roteamento Frontend
        - "traefik.http.routers.frontend.rule=Host(`exemplo.com`)"
        - "traefik.http.routers.frontend.entrypoints=websecure"
        - "traefik.http.routers.frontend.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  network_swarm_public:
    name: network_swarm_public
    external: true
